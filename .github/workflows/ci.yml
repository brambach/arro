# Checks every pull request and push to main: the app's types and tests, the
# database tests (pgTAP) and the edge functions' types.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Applies supabase/migrations to a fresh local database, then runs supabase/tests.
      - run: supabase db start
      - run: supabase test db

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
        env:
          # The functions import npm packages; let Deno fetch them without a node_modules folder.
          DENO_NO_PACKAGE_JSON: '1'
