<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="og.css">

.count span { font-size: 28px; line-height: 32px; font-weight: 450; }
</style></head>
<body>
  <p class="mark disp">saunafam</p>
  <h1 class="head disp">Keep a sauna streak together.</h1>
  <p class="sub">A weekly sauna streak for your family or your sauna crew.</p>
  <div class="card">
    <div class="wall">
      <i class="slat kept"></i><i class="slat kept g1"></i><i class="slat kept g2"></i><i class="slat kept g3"></i>
      <i class="slat kept g1 bench"></i><i class="slat frozen"></i><i class="slat kept"></i><i class="slat kept g2"></i>
      <i class="slat kept g3 bench"></i><i class="slat kept"></i><i class="slat kept g1"></i><i class="slat kept g2"></i>
    </div>
    <p class="count disp"><b>12</b><span>weeks together</span></p>
  </div>
