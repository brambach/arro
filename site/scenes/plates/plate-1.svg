<svg xmlns="http://www.w3.org/2000/svg" width="384" height="256" viewBox="0 0 384 256">
<!--
  Plate 1, the lake sauna, late afternoon. Grays only, white is paper.
  HTML layers sit over the plate in percent of 384 x 256:
    window (white hole): center x 59.90%, y 60.55%, w 4.17%, h 3.91%  (x 222 to 238, y 150 to 160)
    stovepipe top (steam origin): x 60.94%, y 35.16%  (234, 90)
-->
<defs>
